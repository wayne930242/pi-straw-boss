name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  lan:
    uses: ./.github/workflows/lan.yml
  # The full suite in 4 shards side by side (node --test-shard splits the files): about 10 minutes in one job became about 3 (boss, 2026-11-26).
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Build the browser view
        run: npm run gui:build
      - name: Test shard ${{ matrix.shard }} of 4
        run: node --import ./tests/setup.ts --test --test-shard=${{ matrix.shard }}/4 tests/*.test.ts
  publish:
    needs: [windows, lan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Build the browser view
        run: npm run gui:build
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
