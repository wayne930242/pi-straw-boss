name: tmp-inode
on:
  push:
    branches: [fix/winprep-inode-reuse]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run gui:build
      - run: npm test
      - name: old test file is red here
        run: |
          git checkout 56e2cb7 -- tests/server-winprep.test.ts
          if npm run test:one -- tests/server-winprep.test.ts; then echo "old test passed (not red)"; else echo "old test red as expected"; fi
