id = "wayne930242.straw-boss"
name = "Straw Boss"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Toggle the sidebar Agents list into a straw net view: towers first, then main agents, then members"
# agent.view.set is a socket method, and the script reaches it over a Unix socket.
platforms = ["macos", "linux"]

[[actions]]
id = "net"
title = "Toggle the straw net view"
contexts = ["global"]
command = ["/bin/bash", "run.sh", "net-view.mjs"]
